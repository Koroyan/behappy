# Production-shaped stack: PostgreSQL + BeHappy API + Caddy (automatic HTTPS,
# WebSocket pass-through for the real-time community rooms).
#
#   cp deploy/.env.production.example deploy/.env.production   # fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env.production up -d --build
#
# Flitt stays in TEST mode: the server refuses to start in any other mode.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: behappy
      POSTGRES_USER: behappy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U behappy -d behappy"]
      interval: 10s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://behappy:${POSTGRES_PASSWORD}@db:5432/behappy
      DATABASE_SSL: "off"
      TRUST_PROXY: "1"
      PORT: "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
