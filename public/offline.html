<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F8F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111E1C" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <title>BeHappy · Offline</title>
    <style>
      :root {
        --bg: #f7f8f5;
        --card: #ffffff;
        --text: #203b37;
        --muted: #5b6f6b;
        --primary: #2f6f66;
        --line: #e3e8e2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111e1c;
          --card: #18292a;
          --text: #e7efec;
          --muted: #a9bbb6;
          --primary: #8fd0c4;
          --line: #263a38;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
      body {
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Georgian", "Noto Sans", sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
      }
      main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px 24px; text-align: center; }
      svg { width: 72px; height: 72px; }
      h1 { font-size: 22px; line-height: 1.3; margin: 16px 0 8px; }
      p { margin: 0 0 12px; color: var(--muted); }
      .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
      button, a.button {
        display: block; width: 100%; min-height: 48px; border-radius: 14px; border: 0; font: inherit; font-weight: 600;
        padding: 12px 16px; cursor: pointer; text-decoration: none;
      }
      button { background: var(--primary); color: var(--bg); }
      a.button { background: transparent; color: var(--primary); border: 1px solid var(--line); }
      .help { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FAE9F" /><stop offset="0.55" stop-color="#3A7D73" /><stop offset="1" stop-color="#285D55" /></linearGradient>
          <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE2A8" /><stop offset="1" stop-color="#F6A98E" /></linearGradient>
        </defs>
        <circle cx="16" cy="16" r="16" fill="url(#bg)" />
        <path d="M8.75 18.9a7.25 7.25 0 0 1 14.5 0z" fill="url(#sun)" />
        <path d="M6.7 19.1Q16 25.4 25.3 19.1" stroke="#FBF8F1" stroke-width="1.7" stroke-linecap="round" fill="none" />
        <path d="M10.3 24.7Q16 27.2 21.7 24.7" stroke="#FBF8F1" stroke-opacity="0.55" stroke-width="1" stroke-linecap="round" fill="none" />
      </svg>
      <h1 id="title">You're offline</h1>
      <p id="body">This page needs a connection. What you saved on this device is safe, and BeHappy will pick up where you left off.</p>
      <div class="actions">
        <button id="retry" type="button">Try again</button>
        <a class="button" id="home" href="/">Open BeHappy</a>
      </div>
      <p class="help" id="help">If you are in danger right now, call your local emergency number (112 in Georgia and Europe, 911 in the US).</p>
    </main>
    <script>
      (function () {
        var T = {
          ka: ["ინტერნეტი არ არის", "ამ გვერდს კავშირი სჭირდება. რაც ამ მოწყობილობაზე შეინახე, დაცულია და BeHappy იქიდან გააგრძელებს, სადაც გაჩერდი.", "თავიდან ცდა", "BeHappy-ის გახსნა", "თუ ახლა საფრთხეში ხარ, დარეკე 112-ზე."],
          ru: ["Нет подключения", "Этой странице нужен интернет. Всё, что вы сохранили на этом устройстве, на месте, и BeHappy продолжит с того же места.", "Повторить", "Открыть BeHappy", "Если вы сейчас в опасности, позвоните по местному номеру экстренной помощи (112)."],
          hy: ["Կապ չկա", "Այս էջին կապ է պետք։ Այն, ինչ պահել եք այս սարքում, անվտանգ է, և BeHappy-ն կշարունակի այնտեղից, որտեղ կանգ եք առել։", "Կրկին փորձել", "Բացել BeHappy-ն", "Եթե հիմա վտանգի մեջ եք, զանգահարեք 112 (կամ 911)։"]
        };
        var lang = "";
        try { lang = (localStorage.getItem("@behappy_language") || navigator.language || "en").slice(0, 2).toLowerCase(); } catch (e) { lang = (navigator.language || "en").slice(0, 2); }
        var t = T[lang];
        if (t) {
          document.documentElement.lang = lang;
          ["title", "body", "retry", "home", "help"].forEach(function (id, i) { document.getElementById(id).textContent = t[i]; });
        }
        document.getElementById("retry").addEventListener("click", function () { location.reload(); });
        window.addEventListener("online", function () { location.reload(); });
      })();
    </script>
  </body>
</html>
